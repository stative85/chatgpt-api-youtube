[tool.poetry]
name = "suno-forge"
version = "0.1.0"
description = "Suno-ready song packaging backend"
authors = ["SunoForge Team"]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "0.109.0"
uvicorn = "0.27.0"
python-multipart = "0.0.9"
pydantic = "2.6.0"
pydantic-settings = "2.1.0"
langchain = "0.1.5"
langchain-openai = "0.0.5"
pymupdf = "1.23.19"
python-docx = "1.1.0"
tiktoken = "0.5.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
